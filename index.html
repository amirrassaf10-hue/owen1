<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAP</title>

<script src="https://js.puter.com/v2/"></script>

<style>
*{box-sizing:border-box}html,body{width:100%;height:100%}:root{--bg:#f5f7fb;--sidebar:rgba(255,255,255,.82);--panel:rgba(255,255,255,.88);--panel-solid:#fff;--hover:#f0f2f7;--border:#e4e7ef;--text:#151722;--muted:#727889;--accent:#6c5ce7;--accent2:#8b72ff;--user:#eeeafd;--danger:#dc4b5a;--shadow:0 10px 35px rgba(25,30,50,.08);--shadow2:0 18px 55px rgba(25,30,50,.12)}body.dark{--bg:#080a0f;--sidebar:rgba(15,18,25,.88);--panel:rgba(20,24,32,.88);--panel-solid:#141820;--hover:#202530;--border:#2a303b;--text:#f5f7fb;--muted:#949baa;--accent:#8a78ff;--accent2:#a58cff;--user:#28305d;--danger:#ff6675;--shadow:0 10px 35px rgba(0,0,0,.25);--shadow2:0 20px 70px rgba(0,0,0,.38)}body{margin:0;display:flex;overflow:hidden;font-family:Inter,Segoe UI,Tahoma,Arial,sans-serif;background:radial-gradient(circle at 80% -10%,rgba(108,92,231,.12),transparent 30%),var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.sidebar{width:292px;background:var(--sidebar);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 15px;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;font-size:21px;font-weight:800;margin:2px 8px 22px;letter-spacing:-.4px}.brand:before{content:'P';display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 22px rgba(108,92,231,.28)}.new{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:13px;padding:12px 14px;text-align:left;font-weight:700;box-shadow:0 8px 22px rgba(108,92,231,.22);transition:.2s}.new:hover{transform:translateY(-1px);box-shadow:0 11px 28px rgba(108,92,231,.3)}.search{margin:14px 0 12px;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text);outline:0;width:100%;box-shadow:0 3px 14px rgba(0,0,0,.03)}.search:focus,textarea:focus{border-color:var(--accent)}.chat-list{overflow:auto;flex:1;padding-right:2px}.group-title{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin:18px 9px 8px}.chat-item{display:flex;align-items:center;gap:8px;padding:10px 10px;border-radius:11px;margin-bottom:4px;cursor:pointer;font-size:13px;transition:.15s}.chat-item:hover{background:var(--hover)}.chat-item.active{background:linear-gradient(90deg,rgba(108,92,231,.13),transparent);box-shadow:inset 3px 0 var(--accent)}.chat-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.more{border:0;background:transparent;color:var(--muted);padding:4px 7px;border-radius:7px}.more:hover{background:var(--border);color:var(--text)}.sidebar-bottom{border-top:1px solid var(--border);padding-top:10px;margin-top:10px}.tool{width:100%;border:0;background:transparent;color:var(--text);padding:10px 11px;border-radius:10px;text-align:left;font-size:13px;transition:.15s}.tool:hover{background:var(--hover)}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:68px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:rgba(255,255,255,.35);backdrop-filter:blur(16px)}body.dark .top{background:rgba(10,12,17,.35)}.top-left{display:flex;align-items:center;gap:11px}.top-left b{font-size:15px}.online{font-size:11px;color:#27aa6a;background:rgba(39,170,106,.09);padding:5px 8px;border-radius:999px}.icon{width:39px;height:39px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--text);font-size:18px}.icon:hover{background:var(--hover);border-color:var(--border)}.mobile-menu{display:none}.chat{flex:1;overflow-y:auto;padding:38px 8%;scroll-behavior:smooth}.welcome{max-width:920px;margin:11vh auto;text-align:center}.welcome h1{font-size:54px;letter-spacing:-2px;margin:0 0 10px;background:linear-gradient(100deg,var(--accent),#b07cff);-webkit-background-clip:text;color:transparent}.welcome p{color:var(--muted);font-size:17px;margin:0}.message{max-width:940px;margin:0 auto 27px;display:flex;flex-direction:column}.message.user{align-items:flex-end}.message.ai{align-items:flex-start}.role{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--muted);margin:0 9px 6px;text-transform:uppercase}.bubble{max-width:82%;padding:14px 18px;border-radius:18px;line-height:1.85;white-space:pre-wrap;word-break:break-word;background:var(--panel);border:1px solid var(--border);box-shadow:0 5px 18px rgba(0,0,0,.025)}.user .bubble{background:linear-gradient(135deg,var(--user),rgba(108,92,231,.12));border:1px solid rgba(108,92,231,.12)}.actions{display:flex;gap:3px;margin:6px 5px 0}.action{border:0;background:transparent;color:var(--muted);font-size:11px;padding:5px 8px;border-radius:8px}.action:hover{background:var(--hover);color:var(--text)}.bottom{padding:10px 8% 23px}.inputbox{max-width:940px;margin:auto;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:9px 10px;display:flex;align-items:flex-end;box-shadow:var(--shadow2);backdrop-filter:blur(18px);transition:.2s}.inputbox:focus-within{border-color:rgba(108,92,231,.55);box-shadow:0 12px 45px rgba(108,92,231,.12)}textarea{flex:1;min-height:44px;max-height:180px;background:transparent;border:1px solid transparent;outline:0;color:var(--text);resize:none;padding:12px;font-size:15px}.send,.mic{width:45px;height:45px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:18px;margin-left:5px;box-shadow:0 7px 18px rgba(108,92,231,.2)}.mic{background:transparent;color:var(--muted);box-shadow:none}.mic:hover{background:var(--hover);color:var(--text)}.hint{max-width:940px;margin:8px auto 0;text-align:center;color:var(--muted);font-size:10px}.overlay{position:fixed;inset:0;background:rgba(5,7,12,.56);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}.modal{width:min(500px,100%);max-height:90vh;overflow:auto;background:var(--panel-solid);border:1px solid var(--border);border-radius:22px;padding:24px;box-shadow:var(--shadow2)}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0;font-size:20px}.close{border:0;background:var(--hover);color:var(--muted);width:34px;height:34px;border-radius:10px;font-size:20px}.setting{padding:18px 0;border-bottom:1px solid var(--border)}.setting:last-child{border-bottom:0}.setting-title{font-weight:700;font-size:14px;margin-bottom:7px}.setting-desc{font-size:12px;color:var(--muted);line-height:1.65;margin-bottom:10px}select{width:100%;padding:11px;border-radius:11px;border:1px solid var(--border);background:var(--panel);color:var(--text);outline:0}.danger{border:1px solid rgba(220,75,90,.4);background:transparent;color:var(--danger);padding:10px 13px;border-radius:10px;font-size:13px}.danger:hover{background:rgba(220,75,90,.08)}.hidden{display:none!important}@media(max-width:760px){.sidebar{display:none;position:fixed;z-index:10;inset:0 auto 0 0;width:min(292px,88vw);box-shadow:20px 0 60px rgba(0,0,0,.2)}.sidebar.open{display:flex}.mobile-menu{display:block}.top{padding:0 13px}.chat{padding:25px 12px}.bottom{padding:10px}.bubble{max-width:92%}.welcome{margin:80px 10px}.welcome h1{font-size:40px}.hint{display:none}}
</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

<div class="brand">
PAP
</div>

<button class="new" onclick="newChat()">
＋ New Project
</button>

<input
class="search"
id="search"
placeholder="Search chats..."
oninput="renderChats()"
>

<div class="chat-list" id="chatList"></div>

<div class="sidebar-bottom">

<button class="tool" onclick="openSettings()">
Settings
</button>

<button class="tool" onclick="toggleTheme()">
Appearance
</button>

<button class="tool" onclick="exportAll()">
Export all chats
</button>

<button class="tool" onclick="importChats()">
Import chats
</button>

</div>

</aside>


<main class="main">

<header class="top">

<div class="top-left">

<button
class="icon mobile-menu"
onclick="toggleSidebar()">
☰
</button>

<b>PAP</b>

<span class="online">
● Online
</span>

</div>

<button
class="icon"
title="Clear current chat"
onclick="clearCurrentChat()">
⌫
</button>

</header>


<section
class="chat"
id="chat">
</section>


<footer class="bottom">

<div class="inputbox">

<textarea
id="input"
rows="1"
placeholder="Ask anything...">
</textarea>

<button
class="mic"
title="Voice input"
onclick="startVoice()">
◉
</button>

<button
class="send"
onclick="sendMessage()">
↑
</button>

</div>

<div class="hint">
Enter to send · Shift + Enter for a new line
</div>

</footer>

</main>


<!-- SETTINGS WINDOW -->

<div
class="overlay"
id="settingsOverlay"
onclick="if(event.target===this)closeSettings()">

<div class="modal">

<div class="modal-head">

<h2>
Settings
</h2>

<button
class="close"
onclick="closeSettings()">
×
</button>

</div>


<div class="setting">

<div class="setting-title">
Response language
</div>

<div class="setting-desc">
Choose the language PAP should use for its replies.
Auto keeps the conversation language.
</div>

<select
id="language"
onchange="saveLanguage()">

<option value="auto">
Auto — same language as the user
</option>

<option value="en">
English
</option>

<option value="fa">
Persian
</option>

<option value="ar">
Arabic
</option>

<option value="tr">
Turkish
</option>

<option value="az">
Azerbaijani
</option>

<option value="ru">
Russian
</option>

<option value="fr">
French
</option>

<option value="de">
German
</option>

<option value="es">
Spanish
</option>

<option value="it">
Italian
</option>

<option value="pt">
Portuguese
</option>

<option value="zh">
Chinese
</option>

<option value="ja">
Japanese
</option>

<option value="ko">
Korean
</option>

<option value="hi">
Hindi
</option>

</select>

</div>


<div class="setting">

<div class="setting-title">
Memory
</div>

<div class="setting-desc">
Your chats are saved locally in this browser.
</div>

<button
class="danger"
onclick="clearMemory()">

Clear all memory & chats

</button>

</div>

</div>

</div>


<input
type="file"
id="importFile"
accept=".json"
class="hidden"
>


<script>

const STORAGE_KEY="ppai_gemini_v3";

const MODEL="qwen/qwen3.8-flash";

let chats=[];

let currentId=null;

let language=
localStorage.getItem("ppai_language")||"auto";


function uid(){

return Date.now().toString(36)+
Math.random().toString(36).slice(2,8);

}


function save(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(chats)
);

renderChats();

}


function load(){

try{

chats=JSON.parse(
localStorage.getItem(STORAGE_KEY)||"[]"
);

}catch{

chats=[];

}

if(!Array.isArray(chats)){

chats=[];

}

if(!chats.length){

createChat(false);

}else{

currentId=chats[0].id;

renderChats();

renderCurrent();

}

document.getElementById("language").value=
language;

}


function createChat(saveIt=true){

const chat={

id:uid(),

title:"New Project",

messages:[],

createdAt:Date.now(),

updatedAt:Date.now()

};

chats.unshift(chat);

currentId=chat.id;

if(saveIt){

save();

}else{

renderChats();

}

renderCurrent();

}


function getCurrent(){

return chats.find(
c=>c.id===currentId
);

}


function newChat(){

createChat(true);

closeMobile();

}


function renderCurrent(){

const box=
document.getElementById("chat");

box.innerHTML="";

const c=getCurrent();

if(!c || !c.messages.length){

box.innerHTML=`

<div class="welcome" id="welcome">

<h1>Hello</h1>

<p>
Your private AI workspace — fast, focused, and ready to help.
</p>

</div>

`;

return;

}

c.messages.forEach((m,i)=>{

addMessage(
m.content,
m.role==="user"?"user":"ai",
false,
i
);

});

box.scrollTop=
box.scrollHeight;

}


function addMessage(
text,
type,
scroll=true,
index=null
){

const welcome=
document.getElementById("welcome");

if(welcome)
welcome.remove();

const wrap=
document.createElement("div");

wrap.className=
"message "+type;

const role=
document.createElement("div");

role.className="role";

role.textContent=
type==="user"?"You":"PAP";

const bubble=
document.createElement("div");

bubble.className="bubble";

bubble.textContent=text;

wrap.appendChild(role);

wrap.appendChild(bubble);


if(type==="ai"){

const actions=
document.createElement("div");

actions.className="actions";


const copy=
document.createElement("button");

copy.className="action";

copy.textContent="Copy";

copy.onclick=()=>{

navigator.clipboard.writeText(text);

};


const speak=
document.createElement("button");

speak.className="action";

speak.textContent="Read aloud";

speak.onclick=()=>{

speakText(text);

};


const retry=
document.createElement("button");

retry.className="action";

retry.textContent="Retry";

retry.onclick=()=>{

retryMessage(index);

};


actions.append(
copy,
speak,
retry
);

wrap.appendChild(actions);

}


document
.getElementById("chat")
.appendChild(wrap);


if(scroll){

document
.getElementById("chat")
.scrollTop=
document.getElementById("chat").scrollHeight;

}

return bubble;

}


function renderChats(){

const list=
document.getElementById("chatList");

if(!list)return;

const q=
(document.getElementById("search")?.value||"")
.toLowerCase();

list.innerHTML="";

const groups={

Today:[],
Yesterday:[],
"Previous 7 Days":[],
Older:[]

};

const sorted=
[...chats].sort(
(a,b)=>b.updatedAt-a.updatedAt
);

sorted
.filter(c=>
c.title.toLowerCase().includes(q)
)
.forEach(c=>{

groups[
groupName(c.updatedAt)
].push(c);

});


Object.entries(groups).forEach(
([name,arr])=>{

if(!arr.length)return;

const g=
document.createElement("div");

g.className="group-title";

g.textContent=name;

list.appendChild(g);


arr.forEach(c=>{

const row=
document.createElement("div");

row.className=
"chat-item "+
(c.id===currentId?"active":"");

row.onclick=()=>{

currentId=c.id;

renderCurrent();

renderChats();

closeMobile();

};


const title=
document.createElement("div");

title.className="chat-title";

title.textContent=c.title;


const more=
document.createElement("button");

more.className="more";

more.textContent="⋯";

more.onclick=(e)=>{

e.stopPropagation();

renameChat(c.id);

};


row.append(title,more);

list.appendChild(row);

});

});

}


function groupName(t){

const d=new Date(t);

const now=new Date();

const start=
new Date(
now.getFullYear(),
now.getMonth(),
now.getDate()
);

const day=
Math.floor(
(start-d)/86400000
);

if(day<=0)return"Today";

if(day===1)return"Yesterday";

if(day<=7)return"Previous 7 Days";

return"Older";

}


function renameChat(id){

const c=
chats.find(x=>x.id===id);

if(!c)return;

const name=
prompt(
"Chat name:",
c.title
);

if(name&&name.trim()){

c.title=name.trim();

c.updatedAt=Date.now();

save();

}

}


function clearCurrentChat(){

const c=getCurrent();

if(!c)return;

if(!confirm("Clear this chat?"))
return;

c.messages=[];

c.title="New Project";

c.updatedAt=Date.now();

save();

renderCurrent();

}


function clearMemory(){

if(!confirm(
"Delete ALL saved chats and local memory from this browser?"
))
return;

localStorage.removeItem(
STORAGE_KEY
);

chats=[];

createChat(false);

save();

renderCurrent();

closeSettings();

}


async function sendMessage(){

const input=
document.getElementById("input");

const text=
input.value.trim();

if(!text)return;

const c=getCurrent();

if(!c)return;


if(!c.messages.length){

c.title=
text.slice(0,36);

}


c.messages.push({

role:"user",

content:text

});


c.updatedAt=Date.now();

save();

renderCurrent();

input.value="";

resizeInput();


const bubble=
addMessage(
"Thinking...",
"ai"
);


try{

const apiMessages=[];


if(language!=="auto"){

apiMessages.push({

role:"system",

content:
"You are PAP, the AI assistant inside the PAP application. Your name is PAP. If the user asks your name, who you are, what AI you are, or asks you to introduce yourself, answer that your name is PAP. Never identify yourself as Qwen, PAP, OpenAI, ChatGPT, Gemini, or any other model/provider name. Do not reveal or discuss the underlying model/provider identity unless the user explicitly asks about the technical model; even then, your assistant name remains PAP. Always answer in "+
languageName(language)+
". Do not change the selected response language unless the user explicitly asks you to."

});

}


c.messages.forEach(m=>{

apiMessages.push({

role:m.role,

content:m.content

});

});


const response=
await puter.ai.chat(

apiMessages,

{

model:MODEL

}

);


let answer="";


if(typeof response==="string"){

answer=response;

}

else if(
response?.message?.content
){

answer=
response.message.content;

}

else if(response?.text){

answer=response.text;

}

else{

answer=String(response);

}


c.messages.push({

role:"assistant",

content:answer

});


c.updatedAt=Date.now();

save();

renderCurrent();


}catch(error){

console.error(error);

bubble.textContent=
"Connection error. Please try again.";

}

}


function languageName(x){

return{

en:"English",

fa:"Persian",

ar:"Arabic",

tr:"Turkish",

az:"Azerbaijani",

ru:"Russian",

fr:"French",

de:"German",

es:"Spanish",

it:"Italian",

pt:"Portuguese",

zh:"Chinese",

ja:"Japanese",

ko:"Korean",

hi:"Hindi"

}[x]||"English";

}


async function retryMessage(index){

const c=getCurrent();

if(!c || index===null)return;

if(
c.messages[index]?.role!=="assistant"
)return;

const previous=
c.messages[index-1];

if(!previous)return;

c.messages=
c.messages.slice(0,index);

save();

renderCurrent();

document.getElementById("input").value=
previous.content;

await sendMessage();

}


function speakText(text){

if(!("speechSynthesis"in window))
return;

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

speechSynthesis.speak(u);

}


function startVoice(){

const R=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!R){

alert(
"Voice input is not supported by this browser."
);

return;

}

const r=new R();

r.lang="fa-IR";

r.interimResults=false;

r.onresult=e=>{

document.getElementById("input").value=
e.results[0][0].transcript;

resizeInput();

};

r.start();

}


function toggleTheme(){

document.body.classList.toggle("dark");

localStorage.setItem(

"ppai_theme",

document.body.classList.contains("dark")
?"dark"
:"light"

);

}


function openSettings(){

document.getElementById(
"language"
).value=language;

document.getElementById(
"settingsOverlay"
).style.display="flex";

}


function closeSettings(){

document.getElementById(
"settingsOverlay"
).style.display="none";

}


function saveLanguage(){

language=
document.getElementById(
"language"
).value;

localStorage.setItem(
"ppai_language",
language
);

}


function toggleSidebar(){

document
.getElementById("sidebar")
.classList.toggle("open");

}


function closeMobile(){

document
.getElementById("sidebar")
.classList.remove("open");

}


function exportAll(){

const blob=
new Blob(
[
JSON.stringify(
chats,
null,
2
)
],
{
type:"application/json"
}
);

const a=
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"ppai-chats.json";

a.click();

URL.revokeObjectURL(a.href);

}


function importChats(){

const f=
document.getElementById("importFile");

f.value="";

f.click();


f.onchange=async()=>{

const file=f.files[0];

if(!file)return;

try{

const data=
JSON.parse(
await file.text()
);

if(!Array.isArray(data))
throw new Error();

chats=data;

currentId=
chats[0]?.id||null;

if(!currentId)
createChat(false);

save();

renderCurrent();

}catch{

alert(
"Invalid chat file."
);

}

};

}


function resizeInput(){

const x=
document.getElementById("input");

x.style.height="auto";

x.style.height=
Math.min(
x.scrollHeight,
180
)+"px";

}


document
.getElementById("input")
.addEventListener(
"input",
resizeInput
);


document
.getElementById("input")
.addEventListener(
"keydown",
e=>{

if(
e.key==="Enter" &&
!e.shiftKey
){

e.preventDefault();

sendMessage();

}

});


if(
localStorage.getItem("ppai_theme")
==="dark"
){

document.body.classList.add("dark");

}


load();

</script>

</body>
</html>
